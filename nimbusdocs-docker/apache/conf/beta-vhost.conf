<VirtualHost *:80>
    ServerName beta.nimbus.lan
    DocumentRoot /var/www/html/beta

    <Directory /var/www/html/beta>
        Options -Indexes
        Require all granted
    </Directory>

    <Files "audit-report-internal.dat">
        Require all denied
    </Files>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>